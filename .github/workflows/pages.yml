name: Deploy frontend to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Configure Pages
              uses: actions/configure-pages@v5
            - name: Configure exporter service
              env:
                  MAPS_EXPORT_API_URL: ${{ vars.MAPS_EXPORT_API_URL }}
              run: |
                  node -e 'const fs = require("fs"); const url = (process.env.MAPS_EXPORT_API_URL || "").replace(/\/$/, ""); fs.writeFileSync("maps_export_ui/config.js", `window.MAPS_EXPORT_CONFIG = { apiBaseUrl: ${JSON.stringify(url)} };\n`);'
            - name: Upload frontend
              uses: actions/upload-pages-artifact@v3
              with:
                  path: maps_export_ui
            - name: Deploy Pages
              id: deployment
              uses: actions/deploy-pages@v4
