name: Deploy frontend to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v5
            - name: Configure Pages publishing source
              id: pages
              env:
                  GH_TOKEN: ${{ github.token }}
                  PAGES_API_PATH: repos/${{ github.repository }}/pages
              run: |
                  if gh api -H "Accept: application/vnd.github+json" "$PAGES_API_PATH" > /tmp/pages-response.json 2> /tmp/pages-error.log; then
                    if gh api \
                      --method PUT \
                      -H "Accept: application/vnd.github+json" \
                      "$PAGES_API_PATH" \
                      -f build_type=workflow \
                      > /dev/null 2> /tmp/pages-put-error.log; then
                      echo "enabled=true" >> "$GITHUB_OUTPUT"
                    elif grep -q "HTTP 403" /tmp/pages-put-error.log; then
                      echo "enabled=true" >> "$GITHUB_OUTPUT"
                      echo "::notice title=Unable to update Pages settings::The workflow token cannot update the Pages source for this repository. Ensure Pages is enabled and set to GitHub Actions in repository settings."
                    else
                      cat /tmp/pages-put-error.log
                      exit 1
                    fi
                  elif grep -q "HTTP 404" /tmp/pages-error.log; then
                      echo "enabled=false" >> "$GITHUB_OUTPUT"
                      echo "::notice title=GitHub Pages is not enabled::Enable Pages and set the source to GitHub Actions in repository settings to publish this frontend."
                  elif grep -q "HTTP 403" /tmp/pages-error.log; then
                      echo "enabled=true" >> "$GITHUB_OUTPUT"
                      echo "::notice title=Unable to read Pages settings::The workflow token cannot read Pages configuration for this repository. Continuing with deployment using existing configuration."
                  else
                    cat /tmp/pages-error.log
                    exit 1
                  fi
            - name: Configure Pages
              if: steps.pages.outputs.enabled == 'true'
              uses: actions/configure-pages@v5
            - name: Configure exporter service
              if: steps.pages.outputs.enabled == 'true'
              env:
                  MAPS_EXPORT_API_URL: ${{ vars.MAPS_EXPORT_API_URL }}
              run: |
                  node -e 'const fs = require("fs"); const url = (process.env.MAPS_EXPORT_API_URL || "").replace(/\/$/, ""); fs.writeFileSync("maps_export_ui/config.js", `window.MAPS_EXPORT_CONFIG = { apiBaseUrl: ${JSON.stringify(url)} };\n`);'
            - name: Upload frontend
              if: steps.pages.outputs.enabled == 'true'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: maps_export_ui
            - name: Deploy Pages
              if: steps.pages.outputs.enabled == 'true'
              id: deployment
              uses: actions/deploy-pages@v4
